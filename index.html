<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprocket</title>
<style>
:root{--bg:#12171d;--p:#1b232c;--p2:#243039;--l:#33414d;--t:#e8edf1;--m:#8c9aa7;--a:#f2b134}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font:14px/1.4 "Segoe UI",system-ui,sans-serif;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;outline:0;touch-action:none}
button,select,input{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--l);border-radius:5px;padding:6px 11px}
button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--a);outline:0}
button.on,button.pri{background:var(--a);color:#14181c;border-color:var(--a);font-weight:600}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,13,17,.5);backdrop-filter:blur(5px);z-index:10}
.ov.on{display:flex}
.card{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:20px;min-width:300px;max-width:min(940px,94vw);max-height:90vh;overflow:auto}
h1{font-size:clamp(40px,9vw,92px);margin:0 0 18px;font-weight:300;letter-spacing:.14em}
h1 b{font-weight:800;color:var(--a)}
h2{margin:0 0 12px;font-size:20px;font-weight:600}h3{margin:16px 0 4px;color:var(--a);font-size:14px}
.menu{display:flex;flex-direction:column;gap:8px;width:250px}
.menu button{padding:11px 14px;font-size:16px;text-align:left}
.bar{position:fixed;z-index:5;background:rgba(27,35,44,.94);border:1px solid var(--l);border-radius:8px;padding:6px;display:none;gap:6px;align-items:center}
.game .bar{display:flex}
#top{top:10px;left:50%;transform:translateX(-50%);flex-wrap:wrap;justify-content:center;max-width:96vw}
#info{bottom:10px;left:50%;transform:translateX(-50%);max-width:94vw;flex-wrap:wrap;justify-content:center;font-size:13px}.play #info{display:none}.sep{width:1px;height:22px;background:var(--l)}
#pal{left:10px;top:64px;flex-direction:column;align-items:stretch;width:224px;max-height:calc(100% - 80px);overflow:auto}
#tabs{display:flex;gap:4px;flex-wrap:wrap}#tabs button{flex:1;padding:5px 2px;font-size:12px}
#pal .it{text-align:left;display:flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:2px;flex:none;border:1px solid #0006}
.pl,.pl2{display:none}.play .pl{display:inline-flex;gap:8px;align-items:center}
.play .bb,.play #pal{display:none!important}
.row{display:flex;justify-content:space-between;align-items:center;gap:24px;margin:8px 0}
small,.mu{color:var(--m);font-size:12px}
#sl{display:grid;grid-template-columns:repeat(3,200px);gap:12px;margin:10px 0}
.sv{background:var(--p2);border:1px solid var(--l);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:4px}
.sv img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:4px;background:#0003}
.sv div{display:flex;flex-wrap:wrap;gap:4px}.sv button{padding:3px 7px;font-size:12px}
.cm{position:fixed;z-index:30;display:none;background:var(--p);border:1px solid var(--l);border-radius:6px;padding:4px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--p);border:1px solid var(--a);padding:8px 14px;border-radius:6px;z-index:40;display:none}
@media(max-width:720px){#sl{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="bar" id="top">
 <button id="bm" class="pri">Play</button><span class="sep"></span>
 <span class="bb" style="display:contents">
  <button data-t="move" class="on" title="Move (1)">Move</button><button data-t="rot" title="Rotate (2)">Rotate</button><button data-t="scale" title="Scale (3), beams, planks and glass">Scale</button>
  <button id="bn" title="Clear the build">New</button><button id="bd" title="Ctrl+D">Duplicate</button><button id="bx" title="Delete">Delete</button>
 </span>
 <span class="pl">Time <input id="ts" type="range" min="0" max="200" value="100"><b id="tl">100%</b><small>W / S drive, A / D steer</small></span>
 <span class="sep"></span><button id="bs">Saves</button><button id="bmenu">Menu</button>
</div>
<div class="bar" id="info"><span id="inf"></span><span id="pr" style="display:none;gap:6px;align-items:center">Stiffness <input id="pk" type="range" min="1" max="20" step=".5"> Damping <input id="pz" type="range" min="0" max="1" step=".05"></span><span class="bb" style="display:contents"><button data-r="y" title="R">Turn Y 90°</button><button data-r="x" title="T">Turn X 90°</button><button data-r="z" title="G">Turn Z 90°</button></span></div>
<div class="bar" id="pal"><div id="tabs"></div><div id="pl" style="display:flex;flex-direction:column;gap:4px"></div></div>

<div class="ov on" id="menu"><div class="menu"><h1>SPROCKET</h1>
 <button class="pri" id="mp">Play</button><button data-go="chg">Changelog</button><button data-go="opt">Options</button><button id="mq">Quit</button><small id="ver"></small></div></div>
<div class="ov" id="pause"><div class="menu"><h2>Paused</h2><button class="pri" data-go="">Resume</button><button id="ps">Saves</button><button data-go="opt">Options</button><button id="pm">Main menu</button></div></div>
<div class="ov" id="chg"><div class="card"><h2>Changelog</h2><div id="chgb"></div><button class="bk">Back</button></div></div>
<div class="ov" id="opt"><div class="card"><h2>Options</h2><div id="optb"></div><button class="bk">Back</button></div></div>
<div class="ov" id="saves"><div class="card"><h2>Saves</h2>
 <div class="row" style="justify-content:flex-start"><button class="pri" id="sn">Save as new</button><button id="si">Import .spr</button><input id="sf" type="file" accept=".spr" hidden></div>
 <div id="sl"></div>
 <div class="row"><span><button id="pp">&lt;</button> <span id="pgi">1 / 1</span> <button id="pn">&gt;</button></span><button class="bk">Close</button></div></div></div>
<div class="ov" id="ask" style="z-index:20"><div class="card"><h2 id="aq"></h2><input id="ai" maxlength="40" style="width:100%"><div class="row"><button id="ac">Cancel</button><button class="pri" id="ak">Save</button></div></div></div>
<div class="cm" id="cm"><button id="ce">Export .spr</button></div>
<div id="toast"></div>

<script>
// Babylon.js loads as a classic script; Jolt is an ES module, so it is imported. ./lib/ is tried first (needs http, optional), then CDNs.
// Sandboxed frames (e.g. embedded previews) can block the Gamepad API, which Babylon touches when the camera attaches. Stub it so controls still work.
try{navigator.getGamepads()}catch(e){try{Object.defineProperty(navigator,'getGamepads',{value:()=>[],configurable:true})}catch(e2){}}
const BJS=['lib/babylon.js','https://cdn.jsdelivr.net/npm/babylonjs@7/babylon.js','https://unpkg.com/babylonjs@7/babylon.js','https://cdn.babylonjs.com/babylon.js'];
const JLT=['lib/jolt-physics.wasm-compat.js','lib/jolt-physics.wasm-compact.js','https://cdn.jsdelivr.net/npm/jolt-physics/dist/jolt-physics.wasm-compat.js','https://unpkg.com/jolt-physics/dist/jolt-physics.wasm-compat.js'];
const fail=m=>{let d=document.getElementById('err');if(!d){d=document.createElement('div');d.id='err';d.style.cssText='position:fixed;left:10px;bottom:10px;z-index:99;max-width:70vw;background:#3a1418;border:1px solid #c44;color:#fdd;padding:8px 12px;border-radius:6px;font:12px monospace;white-space:pre-wrap';document.body.appendChild(d)}d.textContent+=m+'\n'};
addEventListener('error',e=>{if(!e.error&&!e.message)return;console.error(e.error||e.message);fail((e.error&&e.error.stack)||(e.message+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':'')))});
addEventListener('unhandledrejection',e=>e.reason instanceof Event?console.warn(e.reason):fail(String(e.reason&&e.reason.message||e.reason)));
const ld=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;if(/^https?:/.test(u))s.crossOrigin='anonymous';s.onload=r;s.onerror=j;document.head.appendChild(s)});
async function loadJolt(){for(const u of JLT){try{const m=await import(new URL(u,location.href).href);let f=m.default||m.Jolt;if(!f){await ld(u);f=window.Jolt}if(f){window.JoltInit=f;return}}catch(e){}}}
(async()=>{
 for(const u of BJS){if(window.BABYLON)break;try{await ld(u)}catch(e){}}
 if(!window.BABYLON){fail('Could not load Babylon.js. Check your connection, or put babylon.js in a lib folder (served over http).');return}
 await loadJolt();
 if(!window.JoltInit)fail('Could not load Jolt physics. Building works, but Play is disabled.');
 const s=document.createElement('script');s.type='module';s.textContent=document.getElementById('main').textContent;document.body.appendChild(s)})();
</script>
<script type="text/plain" id="main">

 ['Physics',[['q','Quality',['Low (30 Hz, discrete)','Balanced (60 Hz, discrete)','High (120 Hz, continuous)']]]],

const OPT=Object.assign({gpu:0,res:1,aa:1,bloom:1,sh:1,fov:60,q:1,snap:.1,vol:.8},(()=>{try{return JSON.parse(localStorage.getItem('sprocket:opts')||'{}')}catch(e){return{}}})());
const QS=[{hz:30,cq:0},{hz:60,cq:0},{hz:120,cq:1}];

/* scene */
let cv=$('#c'),engine;
if(!OPT.gpu&&BABYLON.WebGPUEngine&&await BABYLON.WebGPUEngine.IsSupportedAsync){try{engine=new BABYLON.WebGPUEngine(cv,{antialias:true,adaptToDeviceRatio:true,stencil:true});await engine.initAsync()}catch(e){console.warn('WebGPU unavailable, using WebGL2',e);engine=null;const n=cv.cloneNode(false);cv.replaceWith(n);cv=n}}

const scene=new BABYLON.Scene(engine),safe=(n,f)=>{try{return f()}catch(e){fail(n+': '+(e&&e.stack||e))}};
scene.clearColor=new BABYLON.Color4(.09,.11,.14,1);
const cam=new BABYLON.ArcRotateCamera('cam',-.8,1.1,7,new V(0,.5,0),scene);
cam.attachControl(cv,true);cam.inputs.attached.pointers.buttons=[1,2];cam.wheelPrecision=20;cam.lowerRadiusLimit=1;cam.upperBetaLimit=Math.PI-.05;cam.lowerBetaLimit=.05;cam.minZ=.1;
new BABYLON.HemisphericLight('h',new V(0,1,0),scene).intensity=.8;
const sun=new BABYLON.DirectionalLight('s',new V(-.5,-1,-.4),scene);sun.position=new V(20,40,20);sun.intensity=.9;
const sgen=safe('Shadows',()=>{const g=new BABYLON.ShadowGenerator(1024,sun);g.usePercentageCloserFiltering=true;return g});
const pipe=safe('Post-processing',()=>{const p=new BABYLON.DefaultRenderingPipeline('p',true,scene,[cam]);p.bloomThreshold=.9;return p});
const ground=BABYLON.MeshBuilder.CreateGround('g',{width:400,height:400},scene),gt=new BABYLON.DynamicTexture('gt',1024,scene,true),g2=gt.getContext();
g2.fillStyle='#232c35';g2.fillRect(0,0,1024,1024);for(let i=0;i<=10;i++){const v=i*102.4,M=i%5===0;g2.strokeStyle=M?'#7f95a8':'#3a4a58';g2.lineWidth=M?6:3;g2.beginPath();g2.moveTo(v,0);g2.lineTo(v,1024);g2.moveTo(0,v);g2.lineTo(1024,v);g2.stroke()}gt.anisotropicFilteringLevel=8;gt.update();
const gmat=new BABYLON.StandardMaterial('gm',scene);gmat.diffuseTexture=gt;gt.uScale=gt.vScale=40;gmat.specularColor=BABYLON.Color3.Black();
safe('Axes',()=>[[new V(1.5,.02,0),'#e5484d'],[new V(0,.02,1.5),'#4aa3ff']].forEach(([e,c])=>{const l=BABYLON.MeshBuilder.CreateLines('ax',{points:[new V(0,.02,0),e]},scene);l.color=BABYLON.Color3.FromHexString(c);l.isPickable=false}));ground.material=gmat;ground.receiveShadows=true;ground.isPickable=false;

/* parts */
const parts=[],mc={};let armed=null,lk=null,hov=null,ghost=null,gq=null,bad='',sel=null,tool='move',mode='build',game=false,snap=null,ts=1,cur='menu',back=null;
const mat=t=>mc[t]||(mc[t]=(()=>{const d=PARTS[t],m=new BABYLON.StandardMaterial(t,scene);m.diffuseColor=BABYLON.Color3.FromHexString(d.col||MATS[d.m][0]);m.specularColor=new BABYLON.Color3(.3,.3,.3);if(/glass/.test(d.m))m.alpha=.4;if(d.prism){m.backFaceCulling=false;m.twoSidedLighting=true}return m})());
function prism(){const T=[[-.5,-.5],[.5,-.5],[0,.5]],P=[],N=[],I=[],add=(vs,n)=>{const b=P.length/3;vs.forEach(v=>P.push(...v));vs.forEach(()=>N.push(...n));for(let i=1;i<vs.length-1;i++)I.push(b,b+i,b+i+1)};
 add(T.map(([x,z])=>[x,.5,z]),[0,1,0]);add(T.map(([x,z])=>[x,-.5,z]).reverse(),[0,-1,0]);
 for(let i=0;i<3;i++){const a=T[i],c=T[(i+1)%3],dx=c[0]-a[0],dz=c[1]-a[1],l=Math.hypot(dx,dz);add([[a[0],.5,a[1]],[a[0],-.5,a[1]],[c[0],-.5,c[1]],[c[0],.5,c[1]]],[dz/l,0,-dx/l])}

 m.material=mat(t);m.position.set(...p);m.rotationQuaternion=new BABYLON.Quaternion(...(r||d.rot||[0,0,0,1]));m.scaling.set(...(s||d.s));m.metadata={t,...((d.spr||d.wb)?{k:d.wb?3:4,z:d.wb?.6:.5}:{}),...(x&&x.k!==undefined?{k:x.k,z:x.z}:{})};sgen&&sgen.addShadowCaster(m);parts.push(m);dec(m,d);return m}
const EC=new BABYLON.Color4(.03,.04,.06,1),SC=new BABYLON.Color4(.95,.69,.2,1),massOf=m=>{const d=PARTS[m.metadata.t],s=m.scaling;return Math.max(1,s.x*s.y*s.z*(d.cyl?.785:1)*MATS[d.m][1]*.25)};
const am=()=>mc._a||(mc._a=(()=>{const m=new BABYLON.StandardMaterial('a',scene);m.diffuseColor=BABYLON.Color3.FromHexString('#f2b134');m.emissiveColor=new BABYLON.Color3(.3,.18,0);return m})());
function dec(m,d){try{m.enableEdgesRendering(.95);m.edgesWidth=2.5;m.edgesColor=EC}catch(e){}
 const kid=c=>{c.parent=m;c.material=am();c.isPickable=false},B=BABYLON.MeshBuilder;
 if(d.shaft){const a=B.CreateCylinder('sh',{height:.9,diameter:.3},scene),b=B.CreateCylinder('tip',{height:.5,diameterTop:0,diameterBottom:1.1},scene);a.position.y=.95;b.position.y=1.65;kid(a);kid(b)}
 if(d.core){const a=B.CreateCylinder('ar',{height:.7,diameter:.2},scene),b=B.CreateCylinder('at',{height:.4,diameterTop:0,diameterBottom:.7},scene);a.rotation.x=b.rotation.x=Math.PI/2;a.position.set(0,.58,0);b.position.set(0,.58,.55);kid(a);kid(b)}
 if(d.sway){const R=1,tg=t=>new V(Math.cos(t),0,-Math.sin(t)),pts=[];for(let i=0;i<=14;i++){const t=-.8+1.6*i/14;pts.push(new V(R*Math.sin(t),.56,.5+R*Math.cos(t)))}
  kid(B.CreateTube('sw',{path:pts,radius:.05,tessellation:8},scene));
  [[.8,1],[-.8,-1]].forEach(([t,g])=>{const c=B.CreateCylinder('swt',{height:.3,diameterTop:0,diameterBottom:.3},scene),q=new BABYLON.Quaternion();BABYLON.Quaternion.FromUnitVectorsToRef(V.Up(),tg(t).scale(g),q);c.rotationQuaternion=q;c.position.set(R*Math.sin(t),.56,.5+R*Math.cos(t));kid(c)})}
 if(d.spoke)kid(B.CreateBox('sp',{width:1,height:1.03,depth:.12},scene))}
function align(){parts.forEach(w=>{if(w.metadata.t!=='wheel')return;const mo=parts.find(o=>o.metadata.t==='motor'&&o.position.subtract(w.position).length()<.9);if(!mo)return;
 const ax=new V(0,1,0).rotateByQuaternionToRef(mo.rotationQuaternion,new V()),wa=new V(0,1,0).rotateByQuaternionToRef(w.rotationQuaternion,new V()),q=new BABYLON.Quaternion();
 BABYLON.Quaternion.FromUnitVectorsToRef(wa,ax,q);w.rotationQuaternion=q.multiply(w.rotationQuaternion);w.position=mo.position.add(ax.scale(V.Dot(w.position.subtract(mo.position),ax)))})}
function info(){const m=sel,e=$('#inf'),pr=!armed&&m&&m.metadata.k!==undefined;$('#pr').style.display=pr?'inline-flex':'none';if(pr){$('#pk').value=m.metadata.k;$('#pz').value=m.metadata.z}if(armed){e.textContent=`Placing ${PARTS[armed].n}. ${PARTS[armed].lk?'Click a part for one end, then another part for the other end':'Click to place, R / T / G turns it'}. Esc cancels.`;return}if(!m){e.textContent='Build onto the core. Its arrow points forward (W / S drives, A / D steers). Click a part to select it, right-drag to orbit.';return}const d=PARTS[m.metadata.t],z=m.scaling;
 e.textContent=`${d.n}, ${massOf(m).toFixed(0)} kg, ${z.x.toFixed(2)} x ${z.y.toFixed(2)} x ${z.z.toFixed(2)} m`+(d.sway?'. The curved arrows show the swing. Attach the swinging part to its front face':d.shaft?'. Wheels go on the arrow side':d.cyl?'. The stripe shows spin':d.wb?'. The flat edge hinges onto the build and springs; mount wheels at the tip':d.core?'. The arrow shows forward. Drag the core to move the whole build':d.lk?(d.spr?'. Adjust stiffness and damping below':'. Adds a rigid link between its two ends'):'')+(tool==='scale'&&d.sc?'. Drag a dot to stretch that side; hold Alt to stretch both sides':'')}

 for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const A=parts[i],B=parts[j];if(A.metadata.link||B.metadata.link)continue;const r=rel(obb(A),obb(B));if(!Array.isArray(r)||!r[0])continue;const c=r[0],ka=fk(A,c.fa),kb=fk(B,c.fb);if(!ok(ka,kb))continue;ed(i,j);
  if(ka==='S'&&kb==='S')weld(i,j);
  else if(ka+kb==='MH'||ka+kb==='HM')ka==='H'?hinge(i,j):hinge(j,i);
  else if(ka==='W')wbone(i,j);else if(kb==='W')wbone(j,i);else if(ka==='J')joint(i,j);else joint(j,i)}
 parts.forEach((m,i)=>{const l=m.metadata.link;if(!l)return;const a=parts.indexOf(l.a),b=parts.indexOf(l.b);if(a<0||b<0||!bodies[a]||!bodies[b])return;ed(a,b);PARTS[m.metadata.t].spr?spring(m,a,b):weld(a,b,i)});
 const core=parts.findIndex(p=>p.metadata.t==='core'),seen=new Set([core]),stk=[core];while(stk.length){const i=stk.pop();(adj[i]||[]).forEach(j=>{if(!seen.has(j)){seen.add(j);stk.push(j)}})}
 const loose=parts.filter((p,i)=>!p.metadata.link&&!seen.has(i)).length;if(loose)toast(`${loose} part${loose>1?'s are':' is'} not attached to the core`);
 mode='play';acc=0;dir=0;document.body.classList.add('play');$('#bm').textContent='Stop';setDrive()}
function startPlay(){try{startPlay0()}catch(e){fail('Play: '+(e&&e.stack||e));try{if(jolt)J.destroy(jolt)}catch(x){}jolt=null;mode='build';document.body.classList.remove('play');$('#bm').textContent='Play';gz.usePointerToAttachGizmos=true;if(snap)load(snap)}}
function stopPlay(){if(mode!=='play')return;J.destroy(jolt);jolt=null;mode='build';document.body.classList.remove('play');$('#bm').textContent='Play';gz.usePointerToAttachGizmos=true;load(snap)}
const setDrive=()=>{motors.forEach(m=>m.h.SetTargetAngularVelocity(dir*12*m.sg));servos.forEach(s=>s.h.SetTargetAngle(steer*.5*s.sg))};
function tick(h){for(let k=cons.length;k--;){try{const l=cons[k].c.GetTotalLambdaPosition();if(Math.hypot(l.GetX(),l.GetY(),l.GetZ())/h>cons[k].max){phys.RemoveConstraint(cons[k].c);cons.splice(k,1)}}catch(e){}}jolt.Step(h,1)}
function stepPhys(dt){acc+=dt*ts;const h=1/QS[OPT.q].hz;let n=0;while(acc>=h&&n++<10){tick(h);acc-=h}if(n>10)acc=0;
 const c=new V();bodies.forEach((b,i)=>{if(!b)return;const p=b.GetPosition(),r=b.GetRotation(),m=parts[i];m.position.set(p.GetX(),p.GetY(),p.GetZ());m.rotationQuaternion.set(r.GetX(),r.GetY(),r.GetZ(),r.GetW());c.addInPlace(m.position)});
 const nb=bodies.filter(Boolean).length;if(nb)cam.setTarget(V.Lerp(cam.target,c.scale(1/nb),.08),false,false,true);updLinks()}
$('#bm').onclick=()=>mode==='play'?stopPlay():startPlay();
$('#ts').oninput=e=>{ts=e.target.value/100;$('#tl').textContent=e.target.value+'%'};
addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName)&&e.target.type!=='range')return;
 if(e.code==='Escape'){if(armed&&cur===''){disarm();return}if(!game)return;if(cur==='')open('pause');else if(cur==='pause')open('');else if(cur!=='menu')open(back||'');return}
 if(cur!=='')return;if(e.code==='KeyA'||e.code==='ArrowLeft')steer=-1;if(e.code==='KeyD'&&!e.ctrlKey||e.code==='ArrowRight')steer=1;if(e.code==='KeyW'||e.code==='ArrowUp')dir=1;if(e.code==='KeyS'||e.code==='ArrowDown')dir=-1;if(mode==='play')setDrive();
 if(mode!=='build')return;if(e.code==='Digit1'){tool='move';applyTool()}if(e.code==='Digit2'){tool='rot';applyTool()}if(e.code==='Digit3'){tool='scale';applyTool()}
 if(e.code==='KeyR')rot90('y');if(e.code==='KeyT')rot90('x');if(e.code==='KeyG')rot90('z');if(e.code==='Delete'||e.code==='KeyX')del();if(e.ctrlKey&&e.code==='KeyD'){e.preventDefault();dup()}});
addEventListener('keyup',e=>{if(['KeyW','KeyS','ArrowUp','ArrowDown'].includes(e.code))dir=0;if(['KeyA','KeyD','ArrowLeft','ArrowRight'].includes(e.code))steer=0;if(mode==='play')setDrive()});
cv.oncontextmenu=e=>e.preventDefault();
let rerr=0;engine.runRenderLoop(()=>{try{const dt=Math.min(engine.getDeltaTime()/1e3,.05);if(!game)cam.alpha+=dt*.1;else if(mode==='play'&&cur==='')stepPhys(dt);else if(mode==='build'&&cur===''){coreSync();follow();updLinks();if(armed)updGhost()}updHandles();scene.render()}catch(e){if(!rerr++)fail('Frame: '+(e&&e.stack||e))}});
addEventListener('resize',()=>engine.resize());

/* options */
function applyOpts(){try{engine.setHardwareScalingLevel(1/(OPT.res*(devicePixelRatio||1)));if(pipe){pipe.fxaaEnabled=OPT.aa==1;pipe.samples=OPT.aa==2?4:1;pipe.bloomEnabled=!!OPT.bloom}
 sun.shadowEnabled=OPT.sh>0;if(sgen)sgen.mapSize=OPT.sh>1?2048:1024;cam.fov=OPT.fov*Math.PI/180;applyTool();host.onOptions&&host.onOptions(OPT)}catch(e){fail('Options: '+(e&&e.stack||e))}}
$('#optb').innerHTML=OD.map(([g,rows])=>`<h3>${g}</h3>`+rows.map(([k,l,t])=>`<div class="row"><span>${l}</span>`+(t==='chk'?`<input type="checkbox" data-k="${k}" ${OPT[k]?'checked':''}>`:Array.isArray(t)?`<select data-k="${k}">${t.map((o,i)=>`<option value="${i}" ${OPT[k]==i?'selected':''}>${o}</option>`).join('')}</select>`:`<span><input type="range" data-k="${k}" min="${t.min}" max="${t.max}" step="${t.step}" value="${OPT[k]}"> <b data-v="${k}">${(t.f||(v=>v))(OPT[k])}</b></span>`)+'</div>').join('')+(g==='Physics'?'<small>Lower quality keeps big builds smooth but may clip at high speed. Results stay close, just less precise.</small>':'')).join('');
$('#optb').oninput=e=>{const el=e.target,k=el.dataset.k;if(!k)return;OPT[k]=el.type==='checkbox'?+el.checked:+el.value;const t=OD.flatMap(x=>x[1]).find(r=>r[0]===k)[2],v=$(`[data-v=${k}]`);if(v)v.textContent=(t.f||(x=>x))(OPT[k]);
 try{localStorage.setItem('sprocket:opts',JSON.stringify(OPT))}catch(e){}applyOpts()};applyOpts();

/* saves: IndexedDB + versioning */
const DB=new Promise((res,rej)=>{const r=indexedDB.open('sprocket',1);r.onupgradeneeded=()=>r.result.createObjectStore('saves',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction('saves',m),q=f(t.objectStore('saves'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const dbAll=()=>tx('readonly',s=>s.getAll());
async function persist(kind,rec){await tx('readwrite',s=>kind==='del'?s.delete(rec.id):s.put(rec));
 const all=await dbAll();try{localStorage.setItem('sprocket:saves-index',JSON.stringify(all.map(s=>({id:s.id,title:s.title,mod:s.mod,ver:s.ver}))))}catch(e){}
 host.onPersist&&host.onPersist(kind,rec.id)}
const MIG={}; // MIG[n]=d=>d upgraded from version n; version number is bumped automatically
function norm(d){if(!d||typeof d!=='object'||!Array.isArray(d.parts)||!Number.isInteger(d.ver)||d.ver<1)throw Error('This file is damaged or is not a Sprocket build');
 if(d.ver>VER)throw Error(`This build was made in a newer Sprocket (v${d.ver}). Update the game to open it`);
 while(d.ver<VER){d=(MIG[d.ver]||(x=>x))(d);d.ver++}
 d.parts.forEach(p=>{if(!p||!PARTS[p.t]||![p.p,p.r,p.s].every((a,k)=>Array.isArray(a)&&a.length===(k===1?4:3)&&a.every(Number.isFinite))||!p.s.every(v=>v>.01&&v<100)||(PARTS[p.t].lk&&!(Number.isInteger(p.a)&&Number.isInteger(p.b)&&[p.la,p.lb].every(a=>Array.isArray(a)&&a.length===3&&a.every(Number.isFinite)))))throw Error('This build contains invalid parts')});return d}
async function shot(){const a=[cam.alpha,cam.beta,cam.radius,cam.target.clone()],s=sel;gz.attachToMesh(null);
 if(parts.length){const mn=new V(1e9,1e9,1e9),mx=mn.scale(-1);parts.forEach(m=>{m.computeWorldMatrix(true);const b=m.getBoundingInfo().boundingBox;mn.minimizeInPlace(b.minimumWorld);mx.maximizeInPlace(b.maximumWorld)});
  cam.target=V.Center(mn,mx);cam.radius=Math.max(4,mx.subtract(mn).length()*1.4)}
 cam.alpha=-.8;cam.beta=1.15;scene.render();const d=await BABYLON.Tools.CreateScreenshotUsingRenderTargetAsync(engine,cam,{width:360,height:225},'image/jpeg');
 [cam.alpha,cam.beta,cam.radius,cam.target]=a;if(s)gz.attachToMesh(s);return d}
const ask=(q,def)=>new Promise(r=>{$('#aq').textContent=q;$('#ai').value=def||'';$('#ask').classList.add('on');$('#ai').focus();const f=v=>{$('#ask').classList.remove('on');r(v)};$('#ak').onclick=()=>f($('#ai').value.trim()||null);$('#ac').onclick=()=>f(null);$('#ai').onkeydown=e=>{if(e.key==='Enter')f($('#ai').value.trim()||null)}});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let pg=0,cache=[];
async function rsaves(){try{cache=(await dbAll()).sort((a,b)=>b.mod-a.mod)}catch(e){cache=[];toast('Saving is unavailable in this environment: '+(e&&e.message||e))}const n=Math.max(1,Math.ceil(cache.length/6));pg=Math.min(pg,n-1);
 $('#sl').innerHTML=cache.slice(pg*6,pg*6+6).map(s=>`<div class="sv" data-id="${s.id}"><img src="${s.thumb}"><b>${esc(s.title)}</b><small>${s.parts.length} parts, ${new Date(s.mod).toLocaleDateString()}</small><div><button data-a="load">Load</button><button data-a="upd">Update</button><button data-a="ren">Rename</button><button data-a="del">Delete</button></div></div>`).join('')||'<p class="mu">No saves yet. Use Save as new to store this build.</p>';
 $('#pgi').textContent=`${pg+1} / ${n}`}
const rec=(id,title,thumb)=>({id,title,thumb,ver:VER,mod:Date.now(),parts:ser()});
$('#sn').onclick=async()=>{const t=await ask('Name this build',`Build ${cache.length+1}`);if(!t)return;await persist('put',rec(crypto.randomUUID?crypto.randomUUID():Date.now()+'',t,await shot()));rsaves();toast('Saved')};
$('#sl').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const s=cache.find(x=>x.id===b.closest('.sv').dataset.id),a=b.dataset.a;
 try{if(a==='load'){load(norm(structuredClone(s)).parts);open('');toast('Loaded')}
 else if(a==='upd'){await persist('put',rec(s.id,s.title,await shot()));toast('Build updated')}
 else if(a==='ren'){const t=await ask('Rename build',s.title);if(t)await persist('put',{...s,title:t,mod:Date.now()})}
 else if(a==='del'&&confirm(`Delete "${s.title}"?`))await persist('del',s);}catch(er){toast(er.message)}if(cur==='saves')rsaves()};
$('#pp').onclick=()=>{pg=Math.max(0,pg-1);rsaves()};$('#pn').onclick=()=>{pg++;rsaves()};
let cmId;$('#sl').oncontextmenu=e=>{const c=e.target.closest('.sv');if(!c)return;e.preventDefault();cmId=c.dataset.id;const m=$('#cm');m.style.display='block';m.style.left=e.clientX+'px';m.style.top=e.clientY+'px'};
addEventListener('click',()=>$('#cm').style.display='none');
$('#ce').onclick=()=>{const s=cache.find(x=>x.id===cmId),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'sprocket',ver:s.ver,gameVersion:GV,title:s.title,thumb:s.thumb,parts:s.parts})],{type:'application/json'}));a.download=s.title.replace(/[^\w-]+/g,'_')+'.spr';a.click();URL.revokeObjectURL(a.href)};
$('#si').onclick=()=>$('#sf').click();
$('#sf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=norm(JSON.parse(await f.text()));await persist('put',{id:crypto.randomUUID?crypto.randomUUID():Date.now()+'',title:String(d.title||f.name).slice(0,40),thumb:d.thumb||'',ver:d.ver,mod:Date.now(),parts:d.parts});rsaves();toast('Imported')}catch(er){toast(er.message)}};

/* menus */
function open(id,keep){if(!keep)back=cur;cur=id||'';document.querySelectorAll('.ov').forEach(o=>o.classList.toggle('on',o.id===cur));if(cur==='saves')rsaves();if(cur==='menu'||cur==='opt')setVer()}

info();$('#chgb').innerHTML=CHG.map(([v,n])=>`<h3>v${v}</h3><ul>${n.map(x=>`<li>${x}</li>`).join('')}</ul>`).join('');const rend=()=>{const d=engine.description;if(d&&/WebGL|WebGPU/i.test(d))return d;return(engine.isWebGPU||engine._device||/WebGPU/i.test(engine.getClassName()))?'WebGPU1':'WebGL2'};

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2600)}
</script></body></html>
